upstream userservice         { server userservice:8000; }
upstream productservice      { server productservice:8000; }
upstream cartservice         { server cartservice:8000; }
upstream orderservice        { server orderservice:8000; }
upstream paymentservice      { server paymentservice:8000; }
upstream notificationservice { server notificationservice:8000; }

server {
    listen 80;
    server_name _;

    # Pass the original Authorization header (JWT) through to every service.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;

    # ─── userservice ───────────────────────────────────────────────
    location /auth/ { proxy_pass http://userservice/auth/; }
    location /o/    { proxy_pass http://userservice/o/; }

    # ─── productservice ────────────────────────────────────────────
    location /products/   { proxy_pass http://productservice/products/; }
    location /categories/ { proxy_pass http://productservice/categories/; }

    # ─── cartservice ───────────────────────────────────────────────
    location /cart/ { proxy_pass http://cartservice/cart/; }

    # ─── orderservice ──────────────────────────────────────────────
    location /orders/ { proxy_pass http://orderservice/api/orders/; }

    # ─── paymentservice ────────────────────────────────────────────
    location /payments/ { proxy_pass http://paymentservice/api/payments/; }

    # ─── notificationservice ───────────────────────────────────────
    location /notifications/ { proxy_pass http://notificationservice/api/notifications/; }

    # ─── gateway health ────────────────────────────────────────────
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","gateway":"nginx"}';
    }
}
