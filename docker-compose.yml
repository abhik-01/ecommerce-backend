x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

# MySQL host — services read either HOST or DB_HOST, so set both.
x-mysql-host: &mysql-host
  HOST: mysql
  DB_HOST: mysql

services:

  # ─── Infrastructure ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: abhik
      MYSQL_DATABASE: userservice
    ports:
      - "3307:3306"  # host 3307 to avoid clashing with a local MySQL on 3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pabhik"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: ecommerce-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: abhik
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ecommerce-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ecommerce-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: ecommerce-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ─── Microservices ─────────────────────────────────────────────────
  userservice:
    build:
      context: ./userservice
      dockerfile: Dockerfile
    container_name: ecommerce-userservice
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - ./userservice/.env
    environment:
      <<: [*kafka-env, *mysql-host]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py create_oauth2_app &&
             gunicorn userservice.wsgi:application --bind 0.0.0.0:8000 --workers 2"

  cartservice:
    build:
      context: ./cartservice
      dockerfile: Dockerfile
    container_name: ecommerce-cartservice
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - ./cartservice/.env
    environment:
      <<: *kafka-env
      MONGO_HOST: mongo
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: >
      sh -c "gunicorn cartservice.wsgi:application --bind 0.0.0.0:8000 --workers 2"

  productservice:
    build:
      context: ./productservice
      dockerfile: Dockerfile
    container_name: ecommerce-productservice
    restart: unless-stopped
    ports:
      - "8003:8000"
    env_file:
      - ./productservice/.env
    environment:
      <<: [*kafka-env, *mysql-host]
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/1
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py index_products &&
             gunicorn productservice.wsgi:application --bind 0.0.0.0:8000 --workers 2"

  orderservice:
    build:
      context: ./orderservice
      dockerfile: Dockerfile
    container_name: ecommerce-orderservice
    restart: unless-stopped
    ports:
      - "8004:8000"
    env_file:
      - ./orderservice/.env
    environment:
      <<: [*kafka-env, *mysql-host]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn orderservice.wsgi:application --bind 0.0.0.0:8000 --workers 2"

  orderservice-consumer:
    build:
      context: ./orderservice
      dockerfile: Dockerfile
    container_name: ecommerce-orderservice-consumer
    restart: unless-stopped
    env_file:
      - ./orderservice/.env
    environment:
      <<: [*kafka-env, *mysql-host]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      orderservice:
        condition: service_started
    command: >
      sh -c "python manage.py consume_orders"

  paymentservice:
    build:
      context: ./paymentservice
      dockerfile: Dockerfile
    container_name: ecommerce-paymentservice
    restart: unless-stopped
    ports:
      - "8005:8000"
    env_file:
      - ./paymentservice/.env
    environment:
      <<: [*kafka-env, *mysql-host]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn paymentservice.wsgi:application --bind 0.0.0.0:8000 --workers 2"

  notificationservice:
    build:
      context: ./notificationservice
      dockerfile: Dockerfile
    container_name: ecommerce-notificationservice
    restart: unless-stopped
    ports:
      - "8006:8000"
    env_file:
      - ./notificationservice/.env
    environment:
      <<: [*kafka-env, *mysql-host]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn notificationservice.wsgi:application --bind 0.0.0.0:8000 --workers 2"

  notificationservice-consumer:
    build:
      context: ./notificationservice
      dockerfile: Dockerfile
    container_name: ecommerce-notificationservice-consumer
    restart: unless-stopped
    env_file:
      - ./notificationservice/.env
    environment:
      <<: [*kafka-env, *mysql-host]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      notificationservice:
        condition: service_started
    command: >
      sh -c "python manage.py consume_notifications"

  # ─── API Gateway ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - userservice
      - productservice
      - cartservice
      - orderservice
      - paymentservice
      - notificationservice

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  es_data:
